<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D 입체 지구본</title>

  <!-- PWA App Meta Tags -->
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3D지구본">

  <!-- PWA App Icon & Manifest Link -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (3D 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    .globe-marker {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      will-change: transform, opacity;
      pointer-events: auto;
      white-space: nowrap;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .globe-marker:hover {
      z-index: 9999 !important;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #hoverTooltip {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.12s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <!-- 3D Canvas Context Container -->
  <div id="canvas-container"></div>

  <!-- HTML Overlays Container for Pins & Labels -->
  <div id="markers-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

  <!-- Floating Cursor Hover Tooltip Badge -->
  <div id="hoverTooltip" class="opacity-0 glass-panel px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl shadow-2xl border border-amber-400/80 flex items-center gap-2 sm:gap-2.5 text-[11px] sm:text-xs">
    <span id="tooltipFlag" class="text-base sm:text-lg">🇰🇷</span>
    <div>
      <div id="tooltipName" class="font-extrabold text-amber-300 leading-tight">대한민국 (South Korea)</div>
      <div id="tooltipCapital" class="text-[10px] text-slate-200">수도: 서울 (Seoul)</div>
    </div>
  </div>

  <!-- Header & Search Bar -->
  <div class="absolute top-0 left-0 right-0 z-20 p-2 sm:p-4 pointer-events-none flex flex-col items-center gap-1.5 sm:gap-2">
    <!-- Main Search & Title Container -->
    <div class="w-full max-w-md pointer-events-auto glass-panel rounded-2xl p-2 px-3 sm:p-2.5 sm:px-4 shadow-2xl flex items-center justify-between border border-slate-700/50">
      <div class="flex items-center gap-2 sm:gap-2.5">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid font-bold fa-globe text-base sm:text-lg"></i>
        </div>
        <div>
          <h1 class="text-xs sm:text-sm font-bold text-slate-100 leading-tight">3D 입체 지구본</h1>
          <p class="text-[10px] sm:text-[11px] text-slate-400">360° 전방위 터치 회전 & 나만의 메모 DB</p>
        </div>
      </div>

      <!-- Search & DB Management Group -->
      <div class="flex items-center gap-1 sm:gap-1.5 ml-1.5">
        <button onclick="openDbModal()" title="DB 파일 내보내기/불러오기" class="px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-[11px] sm:text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
          <i class="fa-solid fa-database text-[10px] sm:text-xs"></i> <span class="hidden sm:inline">DB 관리</span>
        </button>
        <div class="relative flex-1 max-w-[120px] sm:max-w-[160px]">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="국가/수도 검색..." 
            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-2.5 py-1 sm:py-1.5 pl-6 sm:pl-7 text-[11px] sm:text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-all"
          />
          <i class="fa-solid fa-magnifying-glass absolute left-2 top-2 sm:top-2.5 text-[10px] text-slate-400"></i>
          <!-- Search Results Dropdown -->
          <div id="searchResults" class="hidden absolute top-full left-0 right-0 mt-2 bg-slate-900/95 border border-slate-700 rounded-xl shadow-2xl max-h-56 overflow-y-auto z-50 divide-y divide-slate-800"></div>
        </div>
      </div>
    </div>

    <!-- Category Quick Filters -->
    <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto max-w-full px-1.5 py-0.5 pointer-events-auto hide-scrollbar">
      <button onclick="setFilter('all')" id="filter-all" class="filter-btn active px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[11px] sm:text-xs font-medium bg-blue-600 text-white border border-blue-400/30 shadow-md transition-all">
        ✨ 전체
      </button>
      <button onclick="setFilter('country')" id="filter-country" class="filter-btn px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
        🏳️ 국가/수도
      </button>
      <button onclick="setFilter('landmark')" id="filter-landmark" class="filter-btn px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
        🏔️ 명산/강/호수
      </button>
      <button onclick="setFilter('ocean')" id="filter-ocean" class="filter-btn px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
        🌊 대양/바다
      </button>
    </div>
  </div>

  <!-- Floating Right Controls -->
  <div class="absolute right-2.5 sm:right-3 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-2 sm:gap-2.5 pointer-events-auto">
    <button onclick="resetCameraView()" title="대한민국 중심으로 초기화" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-location-crosshairs text-sm sm:text-base"></i>
    </button>
    <button onclick="toggleAutoRotate()" id="btn-autorotate" title="자동 회전 토글" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-rotate text-sm sm:text-base"></i>
    </button>
    <button onclick="toggleBorders()" id="btn-borders" title="국경선 표시 토글" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel bg-cyan-600/40 border border-cyan-400/50 flex items-center justify-center text-cyan-200 hover:text-white hover:bg-cyan-600/70 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-draw-polygon text-sm sm:text-base"></i>
    </button>
    <button onclick="toggleDayNight()" id="btn-daynight" title="낮/밤 조명 토글" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-sun text-sm sm:text-base text-amber-400"></i>
    </button>
    <button onclick="zoomGlobe(1)" title="확대" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-plus text-sm sm:text-base"></i>
    </button>
    <button onclick="zoomGlobe(-1)" title="축소" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full glass-panel flex items-center justify-center text-slate-200 hover:text-white hover:bg-blue-600/50 active:scale-95 transition-all shadow-lg">
      <i class="fa-solid fa-minus text-sm sm:text-base"></i>
    </button>
  </div>

  <!-- Mobile Bottom Sheet / Country Detail Info Panel -->
  <div id="infoPanel" class="fixed inset-x-0 bottom-0 z-40 transform translate-y-full transition-transform duration-300 ease-out pointer-events-auto">
    <div class="max-w-lg mx-auto glass-panel rounded-t-3xl border-t border-slate-700/80 shadow-2xl overflow-hidden max-h-[75vh] sm:max-h-[80vh] flex flex-col">
      
      <!-- Top Navigation Header -->
      <div class="p-3 pb-2 px-4 sm:px-5 flex items-center justify-between border-b border-slate-800 bg-slate-900/80">
        <button onclick="closeInfoPanel()" class="flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold text-blue-400 hover:text-blue-300 py-1.5 px-2.5 sm:px-3 rounded-xl bg-blue-500/10 border border-blue-500/20 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i> 뒤로가기
        </button>

        <div class="w-10 h-1 bg-slate-600 rounded-full opacity-60"></div>

        <button onclick="closeInfoPanel()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Panel Dynamic Content Body -->
      <div id="panelContent" class="p-4 sm:p-5 overflow-y-auto space-y-3.5 sm:space-y-4 text-slate-200 hide-scrollbar">
        <!-- JS Dynamic Injection -->
      </div>
    </div>
  </div>

  <!-- Memo Modal (국가별 메모 입력 창) -->
  <div id="memoModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-3.5 sm:p-4 pointer-events-auto">
    <div class="w-full max-w-[92vw] sm:max-w-md glass-panel rounded-3xl p-4 sm:p-5 border border-slate-700 shadow-2xl flex flex-col gap-3.5 sm:gap-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 sm:pb-3">
        <button onclick="closeMemoModal()" class="flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold text-blue-400 hover:text-blue-300 py-1 px-2.5 rounded-lg bg-blue-500/10 border border-blue-500/20 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i> 뒤로가기
        </button>
        <h3 id="memoModalTitle" class="text-xs sm:text-sm font-bold text-slate-100 flex items-center gap-1.5">📝 국가 메모</h3>
        <button onclick="closeMemoModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="space-y-1.5 sm:space-y-2">
        <label for="memoInput" class="text-[11px] sm:text-xs text-slate-400 block font-medium">나만의 메모 작성 (기기 DB 자동 보관)</label>
        <textarea id="memoInput" rows="5" placeholder="이 국가에 대한 메모를 입력하세요..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition-all resize-none leading-relaxed"></textarea>
      </div>

      <div class="flex items-center justify-between gap-2 pt-1">
        <button id="deleteMemoBtn" onclick="deleteMemo()" class="hidden px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 text-[11px] sm:text-xs font-semibold active:scale-95 transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-trash-can"></i> 삭제
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="closeMemoModal()" class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] sm:text-xs font-semibold active:scale-95 transition-all">
            취소하기
          </button>
          <button onclick="saveMemo()" class="px-4 py-1.5 sm:px-5 sm:py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold text-[11px] sm:text-xs shadow-lg shadow-amber-500/20 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i> 저장하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- DB Backup & Import Modal -->
  <div id="dbModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-3.5 sm:p-4 pointer-events-auto">
    <div class="w-full max-w-[92vw] sm:max-w-md glass-panel rounded-3xl p-4 sm:p-5 border border-slate-700 shadow-2xl flex flex-col gap-3.5 sm:gap-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 sm:pb-3">
        <button onclick="closeDbModal()" class="flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold text-blue-400 hover:text-blue-300 py-1 px-2.5 rounded-lg bg-blue-500/10 border border-blue-500/20 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i> 뒤로가기
        </button>
        <h3 class="text-xs sm:text-sm font-bold text-amber-300 flex items-center gap-1.5"><i class="fa-solid fa-database"></i> 메모 DB 파일 관리</h3>
        <button onclick="closeDbModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="space-y-2.5 sm:space-y-3">
        <div class="p-3 sm:p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-1.5 sm:space-y-2">
          <h4 class="text-[11px] sm:text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-download text-amber-400"></i> DB 다운로드 (백업 파일 저장)</h4>
          <p class="text-[10px] sm:text-[11px] text-slate-400 leading-relaxed">작성한 모든 메모 데이터를 <code>globe_memos.json</code> 파일로 다운로드합니다.</p>
          <button onclick="downloadMemoDB()" class="w-full py-2 sm:py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-[11px] sm:text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all">
            <i class="fa-solid fa-file-arrow-down"></i> DB 파일 다운로드
          </button>
        </div>

        <div class="p-3 sm:p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-1.5 sm:space-y-2">
          <h4 class="text-[11px] sm:text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-upload text-cyan-400"></i> DB 파일 올리기 (복원)</h4>
          <p class="text-[10px] sm:text-[11px] text-slate-400 leading-relaxed">백업한 DB 파일(<code>.json</code>)을 선택하여 이전 메모를 올립니다.</p>
          <input type="file" id="dbFileInput" accept=".json" onchange="uploadMemoDB(event)" class="hidden">
          <button onclick="document.getElementById('dbFileInput').click()" class="w-full py-2 sm:py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-[11px] sm:text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all">
            <i class="fa-solid fa-file-arrow-up"></i> DB 파일 선택하여 올리기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-opacity duration-300 glass-panel px-4 py-2 rounded-full text-xs font-medium text-slate-200 border border-blue-500/30 shadow-xl">
    안내 메세지
  </div>

  <!-- Main Application Script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2').catch(() => {});
      });
    }

    // ==========================================
    // DEVICE LOCAL DATABASE (STORAGE ENGINE)
    // ==========================================
    const DB_KEY = "3d_globe_memos_v1";

    function loadAllMemos() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveAllMemos(dataObj) {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(dataObj));
      } catch (e) {
        console.warn("DB 저장 실패:", e);
      }
    }

    function getMemoForCountry(isoCode) {
      const memos = loadAllMemos();
      return memos[isoCode] || null;
    }

    function saveMemoForCountry(isoCode, text) {
      const memos = loadAllMemos();
      const nowStr = new Date().toLocaleDateString("ko-KR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      memos[isoCode] = { text: text, updatedAt: nowStr, isoCode: isoCode };
      saveAllMemos(memos);
      return memos[isoCode];
    }

    function deleteMemoForCountry(isoCode) {
      const memos = loadAllMemos();
      delete memos[isoCode];
      saveAllMemos(memos);
    }

    // ==========================================
    // 1. DATA DEFINITIONS & GLOBAL COUNTRY MAP
    // 전 세계 대륙별 모든 주요 국가 영토 위경도 및 대표 명소 수록
    // ==========================================
    const GLOBAL_COUNTRY_MAP = {
      "ATA": { 
        countryName: "남극 (Antarctica)", capital: "연구 기지 (Research Stations)", flag: "🇦🇶", continent: "남극 대륙", lat: -82.8628, lon: 135.0000, 
        description: "지구 최남단에 위치한 거대한 얼음 대륙으로 각국의 과학 연구 기지들이 운영되고 있습니다.",
        landmarks: [
          { name: "남극점", type: "📍 지리적 최남단", desc: "지평선 전체가 빙하로 뒤덮인 지구의 남극점입니다." },
          { name: "세종과학기지 & 장보고기지", type: "🔬 연구 기지", desc: "대한민국이 운영하는 남극의 첨단 과학 연구 기지입니다." },
          { name: "남극 빙상", type: "🧊 대륙 빙하", desc: "지구 민물(담수)의 약 70%가 얼어있는 세계 최대 빙상입니다." },
          { name: "황제펭귄 서식지", type: "🐧 야생 생태 구역", desc: "남극 해안가를 따라 형성된 황제펭귄들의 번식지입니다." },
          { name: "에러버스 화산", type: "🌋 활화산", desc: "지구 최남단에 위치한 신비로운 활화산입니다." }
        ]
      },
      "RUS": { 
        countryName: "러시아 (Russia)", capital: "모스크바 (Moscow)", flag: "🇷🇺", continent: "유라시아", lat: 55.7558, lon: 37.6173, 
        description: "지구 표면 육지 면적의 약 1/8을 차지하는 세계 최대 영토(대한민국의 약 170배) 대륙 국가입니다.",
        landmarks: [

        description = loc.description;
        landmarks = (loc.landmarks && loc.landmarks.length > 0) ? loc.landmarks : [];

        continent = globalItem.continent || "지구 대륙";

        landmarks = globalItem.landmarks || [];
        lat = globalItem.lat;
        lon = globalItem.lon;
      } else {
        const cleanRaw = rawName ? rawName.trim() : "";
        const translatedName = ENGLISH_NAME_MAP[cleanRaw];

        lon = undefined;

      }

        countryName,
        capital,
        flag,
        continent,
        description,
        landmarks,
        lat,
        lon,

        id

      // 모바일 Single / Multi Pointer Event Handlers
      window.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        if (e.touches && e.touches.length > 1) {
          isPointerDown = false;
          activePointerId = null;
          return;
        }

        activePointerId = e.pointerId;
        isPointerDown = true;
        lastPointerPos = { x: e.clientX, y: e.clientY };
        pointerDownPos = { x: e.clientX, y: e.clientY };
        isDraggingGlobe = false;
        currentRotationVelocity = { x: 0, y: 0 };
      });

      window.addEventListener("pointermove", (e) => {
        onPointerMove(e);

        if (!isPointerDown || e.pointerId !== activePointerId) return;
        if (e.touches && e.touches.length > 1) {
          isPointerDown = false;
          activePointerId = null;
          return;
        }

        let deltaX = e.clientX - lastPointerPos.x;
        let deltaY = e.clientY - lastPointerPos.y;
        lastPointerPos = { x: e.clientX, y: e.clientY };

        const dragDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dragDist > 8) isDraggingGlobe = true;

        const maxDelta = 28;
        deltaX = Math.max(-maxDelta, Math.min(maxDelta, deltaX));
        deltaY = Math.max(-maxDelta, Math.min(maxDelta, deltaY));

        // ★ [핵심 개선]: 확대/축소 비율(Zoom)에 비례하는 완벽한 손가락 1:1 드래그 감도 적용
        const zoomFactor = camera.position.z / 16.0;
        const sensitivity = 0.0075 * zoomFactor;
        const stepX = deltaX * sensitivity;
        const stepY = deltaY * sensitivity;

        applyGlobeRotation(stepX, stepY);
        currentRotationVelocity = { x: stepX, y: stepY };
      });

      const onPointerEnd = (e) => {
        if (e.pointerId === activePointerId || !e.pointerId) {
          isPointerDown = false;
          activePointerId = null;
        }
      };
      window.addEventListener("pointerup", onPointerEnd);
      window.addEventListener("pointercancel", onPointerEnd);

      // Wheel Zoom
      window.addEventListener("wheel", (e) => {
        const delta = e.deltaY > 0 ? 0.9 : -0.9;
        camera.position.z = THREE.MathUtils.clamp(camera.position.z + delta, 6.2, 25);
      }, { passive: true });

      // 손가락 두개 (2-Finger Pinch Zoom + Twist Roll Rotation) 이벤트
      window.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          isPointerDown = false;
          activePointerId = null;
          isDraggingGlobe = true;

          const t1 = e.touches[0];
          const t2 = e.touches[1];

          initialPinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          lastPinchAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
          initialCamZ = camera.position.z;
        }
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          isDraggingGlobe = true;
          const t1 = e.touches[0];
          const t2 = e.touches[1];

          // 1. Pinch Zoom (확대 / 축소)
          const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          if (dist > 0) {
            const factor = initialPinchDist / dist;
            camera.position.z = THREE.MathUtils.clamp(initialCamZ * factor, 6.2, 25);
          }

          // 2. 두 손가락 반대방향 스와이프 (Twist/Roll 360도 회전)
          const currentAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
          let deltaAngle = currentAngle - lastPinchAngle;

          while (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
          while (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;

          if (Math.abs(deltaAngle) > 0.002) {
            const qZ = new THREE.Quaternion();
            qZ.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -deltaAngle);
            globeGroup.quaternion.premultiply(qZ);
            lastPinchAngle = currentAngle;
          }
        }
      }, { passive: true });

      window.addEventListener("touchend", (e) => {
        if (e.touches.length < 2) {
          initialPinchDist = 0;
        }
      });

      renderer.domElement.addEventListener("click", onGlobeClick);

      animate();
      focusLocation(37.5665, 126.9780, false);
    }

    function applyGlobeRotation(rotX, rotY) {
      if (Math.abs(rotX) < 0.000001 && Math.abs(rotY) < 0.000001) return;

      const qY = new THREE.Quaternion();
      qY.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotX);

      const qX = new THREE.Quaternion();
      const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      qX.setFromAxisAngle(cameraRight, rotY);

      globeGroup.quaternion.premultiply(qY);
      globeGroup.quaternion.premultiply(qX);
    }

    function createStars() {
      const starGeometry = new THREE.BufferGeometry();
      const count = 1200;
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 220;
        positions[i + 1] = (Math.random() - 0.5) * 220;
        positions[i + 2] = (Math.random() - 0.5) * 220;
      }

      starGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.75 });
      scene.add(new THREE.Points(starGeometry, starMaterial));
    }

    function createProceduralEarthTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      const oceanGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      oceanGrad.addColorStop(0, "#0b2545");
      oceanGrad.addColorStop(0.5, "#134074");
      oceanGrad.addColorStop(1, "#0b2545");
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#2d6a4f";
      ctx.strokeStyle = "#52b788";
      ctx.lineWidth = 2;

      function mapCoords(lon, lat) {
        return { x: ((lon + 180) / 360) * canvas.width, y: ((90 - lat) / 180) * canvas.height };
      }

      function drawLandmass(points) {
        ctx.beginPath();
        points.forEach((pt, i) => {
          const { x, y } = mapCoords(pt[0], pt[1]);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      drawLandmass([[30, 70], [140, 70], [140, 30], [128, 36], [126, 38], [120, 25], [100, 10], [70, 20], [40, 30], [10, 40], [10, 65]]);
      drawLandmass([[-15, 35], [35, 35], [50, 10], [40, -30], [20, -35], [10, 0], [-15, 15]]);
      drawLandmass([[-160, 70], [-60, 70], [-60, 45], [-80, 25], [-100, 20], [-120, 30], [-170, 60]]);
      drawLandmass([[-80, 10], [-35, -5], [-40, -20], [-65, -55], [-75, -45], [-80, -10]]);
      drawLandmass([[115, -15], [153, -15], [150, -38], [115, -35]]);

      return new THREE.CanvasTexture(canvas);
    }

    function createGlobe() {
      const geometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
      const textureLoader = new THREE.TextureLoader();
      const fallbackTexture = createProceduralEarthTexture();

      const earthMaterial = new THREE.MeshPhongMaterial({
        map: fallbackTexture,
        shininess: 15,
        specular: new THREE.Color(0x333333)
      });

      textureLoader.load(
        'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
        (tex) => {
          earthMaterial.map = tex;
          earthMaterial.needsUpdate = true;
        },
        undefined, () => {}
      );

      globeMesh = new THREE.Mesh(geometry, earthMaterial);
      globeGroup.add(globeMesh);

      const atmosGeometry = new THREE.SphereGeometry(GLOBE_RADIUS * 1.02, 64, 64);
      const atmosMaterial = new THREE.MeshLambertMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide
      });
      atmosphereMesh = new THREE.Mesh(atmosGeometry, atmosMaterial);
      globeGroup.add(atmosphereMesh);
    }

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    function vector3ToLatLon(vec) {
      const norm = vec.clone().normalize();
      const phi = Math.acos(Math.max(-1, Math.min(1, norm.y)));
      const lat = 90 - (phi * (180 / Math.PI));
      const theta = Math.atan2(norm.z, -norm.x) * (180 / Math.PI);
      let lon = theta - 180;
      while (lon > 180) lon -= 360;
      while (lon < -180) lon += 360;
      return { lat, lon };
    }

    function initHighlightLayer() {
      highlightCanvas = document.createElement("canvas");
      highlightCanvas.width = 2048;
      highlightCanvas.height = 1024;

      highlightTexture = new THREE.CanvasTexture(highlightCanvas);
      highlightTexture.minFilter = THREE.LinearFilter;
      highlightTexture.magFilter = THREE.LinearFilter;

      const highlightGeom = new THREE.SphereGeometry(GLOBE_RADIUS * 1.004, 64, 64);
      const highlightMat = new THREE.MeshBasicMaterial({
        map: highlightTexture,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        side: THREE.FrontSide
      });

      highlightMesh = new THREE.Mesh(highlightGeom, highlightMat);
      globeGroup.add(highlightMesh);
    }

    function drawHighlightTexture(isoCode, isSelected) {
      if (!highlightCanvas) return;
      const ctx = highlightCanvas.getContext("2d");
      ctx.clearRect(0, 0, highlightCanvas.width, highlightCanvas.height);

      if (!isoCode) {
        highlightTexture.needsUpdate = true;
        return;
      }

      const feature = geoFeatures.find(f => f.id === isoCode);
      if (!feature) {
        highlightTexture.needsUpdate = true;
        return;
      }

      ctx.save();
      if (isSelected) {
        ctx.fillStyle = "rgba(6, 182, 212, 0.78)";
        ctx.strokeStyle = "#FFFFFF";
        ctx.shadowColor = "#00FFFF";
      } else {
        ctx.fillStyle = "rgba(250, 204, 21, 0.75)";
        ctx.strokeStyle = "#FFFFFF";
        ctx.shadowColor = "#FACC15";
      }
      ctx.lineWidth = 5;
      ctx.shadowBlur = 16;

      const drawRing = (ring) => {
        ctx.beginPath();
        for (let i = 0; i < ring.length; i++) {
          const x = ((ring[i][0] + 180) / 360) * highlightCanvas.width;
          const y = ((90 - ring[i][1]) / 180) * highlightCanvas.height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      };

      const geom = feature.geometry;
      if (geom.type === "Polygon") geom.coordinates.forEach(drawRing);
      else if (geom.type === "MultiPolygon") geom.coordinates.forEach(poly => poly.forEach(drawRing));

      ctx.restore();
      highlightTexture.needsUpdate = true;
    }

    function loadGeoJSONBorders() {
      borderGroup = new THREE.Group();
      globeGroup.add(borderGroup);

      const borderMaterial = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });

      fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
        .then(res => res.json())
        .then(data => {
          geoFeatures = data.features;
          geoFeatures.forEach(feature => {
            const geom = feature.geometry;
            if (geom.type === 'Polygon') geom.coordinates.forEach(ring => drawBorderRing(ring, borderGroup, borderMaterial));
            else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(polygon => polygon.forEach(ring => drawBorderRing(ring, borderGroup, borderMaterial)));
          });
        })
        .catch(err => console.warn("GeoJSON 국경선 로드 실패:", err));
    }

    function drawBorderRing(ring, group, material) {
      const points = [];
      for (let i = 0; i < ring.length; i++) {
        points.push(latLonToVector3(ring[i][1], ring[i][0], GLOBE_RADIUS * 1.006));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      group.add(new THREE.Line(geometry, material));
    }

    function toggleBorders() {
      showBorders = !showBorders;
      if (borderGroup) borderGroup.visible = showBorders;
      const btn = document.getElementById("btn-borders");
      if (showBorders) {
        btn.classList.add("bg-cyan-600/40", "border-cyan-400/50", "text-cyan-200");
        showToast("국경 경계선 표시 ON");
      } else {
        btn.classList.remove("bg-cyan-600/40", "border-cyan-400/50", "text-cyan-200");
        showToast("국경 경계선 표시 OFF");
      }
    }

    function pointInPolygon(point, vs) {
      const x = point[0], y = point[1];
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        const xi = vs[i][0], yi = vs[i][1];
        const xj = vs[j][0], yj = vs[j][1];
        const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function pointInGeoJSON(lon, lat, feature) {
      const geom = feature.geometry;
      if (geom.type === 'Polygon') return pointInPolygon([lon, lat], geom.coordinates[0]);
      else if (geom.type === 'MultiPolygon') return geom.coordinates.some(poly => pointInPolygon([lon, lat], poly[0]));
      return false;
    }

    function onPointerMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      const tooltip = document.getElementById("hoverTooltip");
      tooltip.style.transform = `translate3d(${event.clientX + 14}px, ${event.clientY + 14}px, 0)`;

      if (globeMesh) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(globeMesh);

        if (intersects.length > 0) {
          const localPoint = globeMesh.worldToLocal(intersects[0].point.clone());
          const { lat, lon } = vector3ToLatLon(localPoint);
          const hitFeature = geoFeatures.find(f => pointInGeoJSON(lon, lat, f));

          if (hitFeature) {
            const hitIsoCode = hitFeature.id;
            if (hoveredIsoCode !== hitIsoCode) {
              hoveredIsoCode = hitIsoCode;
              drawHighlightTexture(hitIsoCode, hitIsoCode === selectedIsoCode);
              const countryInfo = getCountryInfo(hitIsoCode, hitFeature.properties?.name);

              document.getElementById("tooltipFlag").innerText = countryInfo.flag;
              document.getElementById("tooltipName").innerText = countryInfo.countryName;
              document.getElementById("tooltipCapital").innerText = `수도: ${countryInfo.capital}`;
              tooltip.classList.remove("opacity-0");
            }
            document.body.style.cursor = "pointer";
            return;
          }
        }
      }

      if (hoveredIsoCode && hoveredIsoCode !== selectedIsoCode) {
        hoveredIsoCode = null;
        drawHighlightTexture(selectedIsoCode, true);
        tooltip.classList.add("opacity-0");
      } else if (!hoveredIsoCode && !selectedIsoCode) {
        tooltip.classList.add("opacity-0");
      }
      document.body.style.cursor = "default";
    }

    // ★ [오류 수정 완료]: 국가 터치 시 바다(0,0)로 튕기는 버그 완벽 수정
    function onGlobeClick() {
      if (isDraggingGlobe) return;

      if (globeMesh) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(globeMesh);

        if (intersects.length > 0) {
          const localPoint = globeMesh.worldToLocal(intersects[0].point.clone());
          const { lat, lon } = vector3ToLatLon(localPoint);
          const hitFeature = geoFeatures.find(f => pointInGeoJSON(lon, lat, f));

          if (hitFeature) {
            const hitIsoCode = hitFeature.id;
            const countryInfo = getCountryInfo(hitIsoCode, hitFeature.properties?.name);

            // DB에 중심 좌표가 있는 나라는 해당 좌표로, 미등록 영토는 터치된 지구 표면 실제 위경도로 이동
            const targetLat = (countryInfo.lat !== undefined && countryInfo.lat !== null && countryInfo.lat !== 0) ? countryInfo.lat : lat;
            const targetLon = (countryInfo.lon !== undefined && countryInfo.lon !== null && countryInfo.lon !== 0) ? countryInfo.lon : lon;

            onSelectLocation({
              ...countryInfo,
              lat: targetLat,
              lon: targetLon,
            });
          }
        }
      }
    }

    function createMarkers() {
      const container = document.getElementById("markers-container");
      container.innerHTML = "";
      markers = [];

      LOCATIONS.forEach(loc => {
        const pos = latLonToVector3(loc.lat, loc.lon, GLOBE_RADIUS + 0.05);

        const el = document.createElement("div");
        el.className = "globe-marker flex items-center gap-1 sm:gap-1.5 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full text-[10px] sm:text-[11px] font-bold shadow-xl backdrop-blur-md border";
        
        if (loc.category === "country") {
          el.classList.add("bg-slate-900/90", "text-slate-100", "border-blue-400/60");
          el.innerHTML = `<span class="text-[11px] sm:text-xs">${loc.flag}</span><span class="text-blue-200">${loc.countryName}</span>`;
        } else {
          el.classList.add("bg-blue-900/80", "text-cyan-200", "border-cyan-400/40");
          el.innerHTML = `<span class="text-[11px] sm:text-xs">🌊</span><span>${loc.countryName}</span>`;
        }

        el.addEventListener("mouseenter", () => {
          if (loc.isoCode) {
            hoveredIsoCode = loc.isoCode;
            drawHighlightTexture(loc.isoCode, loc.isoCode === selectedIsoCode);
          }
        });
        el.addEventListener("mouseleave", () => {
          if (loc.isoCode !== selectedIsoCode) {
            hoveredIsoCode = null;
            drawHighlightTexture(selectedIsoCode, true);
          }
        });
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!isDraggingGlobe) onSelectLocation(loc);
        });

        container.appendChild(el);
        markers.push({ element: el, position: pos, data: loc });
      });
    }

    function updateMarkersPosition() {
      camera.getWorldPosition(cameraWorldPos);
      globeGroup.updateMatrixWorld();

      const halfW = window.innerWidth * 0.5;
      const halfH = window.innerHeight * 0.5;

      markers.forEach(m => {
        if (activeFilter !== "all" && m.data.category !== activeFilter) {
          m.element.style.display = "none";
          return;
        }

        tempVec.copy(m.position).applyMatrix4(globeGroup.matrixWorld);
        const dot = tempVec.clone().normalize().dot(cameraWorldPos.clone().normalize());

        if (dot < 0.22) {
          m.element.style.display = "none";
          return;
        }

        tempVec.project(camera);
        const x = (tempVec.x * halfW) + halfW;
        const y = -(tempVec.y * halfH) + halfH;

        m.element.style.display = "flex";
        m.element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -100%)`;
        m.element.style.zIndex = Math.floor((1 - tempVec.z) * 1000);
      });
    }

    // 국가 선택 시 북쪽(+Y)이 위로 정방향 정열되는 3D 쿼터니언 회전 연산
    function focusLocation(lat, lon) {
      const targetPos = latLonToVector3(lat, lon, 1).normalize();
      const northVec = new THREE.Vector3(0, 1, 0);

      let eastVec, tangentNorthVec;

      if (Math.abs(lat) > 89.9) {
        eastVec = new THREE.Vector3(1, 0, 0);
        tangentNorthVec = new THREE.Vector3().crossVectors(targetPos, eastVec).normalize();
      } else {
        eastVec = new THREE.Vector3().crossVectors(northVec, targetPos).normalize();
        tangentNorthVec = new THREE.Vector3().crossVectors(targetPos, eastVec).normalize();
      }

      const m = new THREE.Matrix4();
      m.set(
        eastVec.x, eastVec.y, eastVec.z, 0,
        tangentNorthVec.x, tangentNorthVec.y, tangentNorthVec.z, 0,
        targetPos.x, targetPos.y, targetPos.z, 0,
        0, 0, 0, 1
      );

      const startQ = globeGroup.quaternion.clone();
      const targetQ = new THREE.Quaternion().setFromRotationMatrix(m);

      const startZoom = camera.position.z;
      const targetZoom = 12;

      const startTime = performance.now();
      const duration = 850;
      isFocusingAnimation = true;

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2;

        globeGroup.quaternion.slerpQuaternions(startQ, targetQ, easeProgress);
        camera.position.z = THREE.MathUtils.lerp(startZoom, targetZoom, easeProgress);

        if (progress < 1) requestAnimationFrame(step);
        else isFocusingAnimation = false;
      }
      requestAnimationFrame(step);
    }

    function restoreZoom(targetZ) {
      if (targetZ === null || targetZ === undefined) return;
      const startZ = camera.position.z;
      const startTime = performance.now();
      const duration = 650;
      isFocusingAnimation = true;

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2;

        camera.position.z = THREE.MathUtils.lerp(startZ, targetZ, easeProgress);

        if (progress < 1) requestAnimationFrame(step);
        else isFocusingAnimation = false;
      }
      requestAnimationFrame(step);
    }

    function onSelectLocation(item) {
      const panel = document.getElementById("infoPanel");
      const isPanelClosed = panel.classList.contains("translate-y-full");

      if (isPanelClosed || preSelectionCamZ === null) {
        preSelectionCamZ = camera.position.z;
      }

      selectedIsoCode = item.isoCode;
      drawHighlightTexture(item.isoCode, true);
      focusLocation(item.lat, item.lon);
      renderInfoPanel(item);
      openInfoPanelUI();
    }

    // ==========================================
    // 3. MEMO MODAL & DB CONTROLS
    // ==========================================
    function openMemoModal(isoCode) {
      currentEditingIsoCode = isoCode || selectedIsoCode;
      if (!currentEditingIsoCode) return;

      const info = getCountryInfo(currentEditingIsoCode);
      document.getElementById("memoModalTitle").innerText = `📝 ${info.countryName} 메모`;

      const memoInput = document.getElementById("memoInput");
      const deleteBtn = document.getElementById("deleteMemoBtn");

      memoInput.value = "";
      deleteBtn.classList.add("hidden");

      const savedMemo = getMemoForCountry(currentEditingIsoCode);
      if (savedMemo && savedMemo.text) {
        memoInput.value = savedMemo.text;
        deleteBtn.classList.remove("hidden");
      }

      const modal = document.getElementById("memoModal");
      modal.classList.remove("hidden");

      if (!history.state || !history.state.memoOpen) {
        history.pushState({ memoOpen: true, isoCode: currentEditingIsoCode }, "");
      }
    }

    function closeMemoModal(fromHistory = false) {
      const modal = document.getElementById("memoModal");
      modal.classList.add("hidden");

      if (!fromHistory && history.state && history.state.memoOpen) {
        history.back();
      }
      currentEditingIsoCode = null;
    }

    function saveMemo() {
      if (!currentEditingIsoCode) return;
      const text = document.getElementById("memoInput").value.trim();

      if (!text) {
        deleteMemo();
        return;
      }

      const memoData = saveMemoForCountry(currentEditingIsoCode, text);
      showToast("메모가 기기 DB에 저장되었습니다.");
      closeMemoModal();

      if (selectedIsoCode === currentEditingIsoCode) {
        updateMemoUIInPanel(currentEditingIsoCode, memoData);
      }
    }

    function deleteMemo() {
      if (!currentEditingIsoCode) return;
      deleteMemoForCountry(currentEditingIsoCode);
      showToast("메모가 삭제되었습니다.");
      closeMemoModal();

      if (selectedIsoCode === currentEditingIsoCode) {
        updateMemoUIInPanel(currentEditingIsoCode, null);
      }
    }

    function updateMemoUIInPanel(isoCode, memoData) {
      const box = document.getElementById(`countryMemoBox_${isoCode}`);
      const btnText = document.getElementById(`memoBtnText_${isoCode}`);
      if (!box) return;

      if (memoData && memoData.text) {
        document.getElementById(`memoContent_${isoCode}`).innerText = memoData.text;
        document.getElementById(`memoDate_${isoCode}`).innerText = memoData.updatedAt || "";
        box.classList.remove("hidden");
        if (btnText) btnText.innerText = "메모 수정";
      } else {
        box.classList.add("hidden");
        if (btnText) btnText.innerText = "메모 작성";
      }
    }

    function openDbModal() {
      document.getElementById("dbModal").classList.remove("hidden");
      if (!history.state || !history.state.dbOpen) {
        history.pushState({ dbOpen: true }, "");
      }
    }

    function closeDbModal(fromHistory = false) {
      document.getElementById("dbModal").classList.add("hidden");
      if (!fromHistory && history.state && history.state.dbOpen) {
        history.back();
      }
    }

    function downloadMemoDB() {
      const memos = loadAllMemos();
      const jsonStr = JSON.stringify(memos, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `globe_memos_backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast("DB 파일이 다운로드되었습니다.");
    }

    function uploadMemoDB(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedObj = JSON.parse(e.target.result);
          if (typeof importedObj === "object" && importedObj !== null) {
            saveAllMemos(importedObj);
            showToast("DB 파일을 성공적으로 올렸습니다!");
            closeDbModal();
            if (selectedIsoCode) {
              const memo = getMemoForCountry(selectedIsoCode);
              updateMemoUIInPanel(selectedIsoCode, memo);
            }
          } else {
            showToast("올바른 JSON DB 파일이 아닙니다.");
          }
        } catch (err) {
          showToast("DB 파일 읽기 실패: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // ==========================================
    // 4. UI MODAL & NAVIGATION
    // ==========================================
    function renderInfoPanel(item) {
      const content = document.getElementById("panelContent");

      let landmarksHTML = "";
      if (item.landmarks && item.landmarks.length > 0) {
        landmarksHTML = `
          <div class="space-y-1.5 sm:space-y-2 mt-2 sm:mt-3">
            <h4 class="text-[11px] sm:text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center justify-between">
              <span>🏔️ 대표 유명 관광지 명소 및 지형</span>
              <span class="text-[10px] text-slate-400 font-normal">총 ${item.landmarks.length}개 수록</span>
            </h4>
            <div class="grid grid-cols-1 gap-2">
              ${item.landmarks.map(lm => `
                <div class="p-2.5 sm:p-3 rounded-xl bg-slate-900/90 border border-slate-800 flex flex-col gap-1">
                  <div class="flex items-center justify-between">
                    <span class="text-[11px] sm:text-xs font-bold text-amber-300">${lm.name}</span>
                    <span class="text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">${lm.type}</span>
                  </div>
                  <p class="text-[11px] sm:text-xs text-slate-300 leading-relaxed">${lm.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      content.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2.5 sm:gap-3">
            <span class="text-3xl sm:text-4xl shadow-sm">${item.flag}</span>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-base sm:text-lg font-bold text-white leading-tight">${item.countryName}</h2>
              </div>
              <p class="text-[11px] sm:text-xs text-slate-300 mt-1 flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold">🏛️ 수도: ${item.capital}</span>
                <span class="text-slate-400">| 🌍 ${item.continent}</span>
              </p>
            </div>
          </div>
          
          <div class="flex flex-col gap-1.5 items-end">
            <button onclick="openMemoModal('${item.isoCode}')" title="메모하기" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-[11px] sm:text-xs font-bold flex items-center gap-1.5 active:scale-95 transition-all shadow-md">
              <i class="fa-solid fa-pen-to-square"></i> <span id="memoBtnText_${item.isoCode}">메모 작성</span>
            </button>
            <button onclick="focusLocation(${item.lat}, ${item.lon})" title="초점 맞추기" class="px-2.5 py-1 rounded-xl bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/30 text-[10px] sm:text-[11px] font-semibold flex items-center gap-1 active:scale-95 transition-all">
              <i class="fa-solid fa-crosshairs"></i> 이동
            </button>
          </div>
        </div>

        <div id="countryMemoBox_${item.isoCode}" class="hidden p-3 sm:p-3.5 rounded-2xl bg-amber-950/40 border border-amber-500/40 text-xs space-y-1 shadow-inner">
          <div class="flex items-center justify-between text-[10px] sm:text-[11px] font-bold text-amber-400 border-b border-amber-500/20 pb-1 mb-1">
            <span class="flex items-center gap-1"><i class="fa-solid fa-note-sticky"></i> 작성된 메모</span>
            <span class="text-[9px] sm:text-[10px] text-amber-400/80 font-normal" id="memoDate_${item.isoCode}"></span>
          </div>
          <p id="memoContent_${item.isoCode}" class="text-slate-200 whitespace-pre-wrap leading-relaxed text-[11px] sm:text-xs"></p>
        </div>

        <div class="p-3 sm:p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800/80">
          <p class="text-[11px] sm:text-xs text-slate-300 leading-relaxed">${item.description}</p>
        </div>

        ${landmarksHTML}
      `;

      const memo = getMemoForCountry(item.isoCode);
      if (memo) {
        updateMemoUIInPanel(item.isoCode, memo);
      }
    }

    function openInfoPanelUI() {
      const panel = document.getElementById("infoPanel");
      panel.classList.remove("translate-y-full");

      if (!history.state || !history.state.panelOpen) {
        history.pushState({ panelOpen: true }, "");
      }
    }

    function closeInfoPanel(fromHistory = false) {
      const panel = document.getElementById("infoPanel");
      panel.classList.add("translate-y-full");

      if (!fromHistory && history.state && history.state.panelOpen) {
        history.back();
      }

      if (preSelectionCamZ !== null) {
        restoreZoom(preSelectionCamZ);
        preSelectionCamZ = null;
      }

      selectedIsoCode = null;
      hoveredIsoCode = null;
      drawHighlightTexture(null, false);
    }

    window.addEventListener("popstate", () => {
      const dbModal = document.getElementById("dbModal");
      if (dbModal && !dbModal.classList.contains("hidden")) {
        closeDbModal(true);
        return;
      }

      const memoModal = document.getElementById("memoModal");
      if (memoModal && !memoModal.classList.contains("hidden")) {
        closeMemoModal(true);
        return;
      }

      const panel = document.getElementById("infoPanel");
      if (panel && !panel.classList.contains("translate-y-full")) {
        closeInfoPanel(true);
      }
    });

    function setFilter(category) {
      activeFilter = category;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-blue-600", "text-white", "border-blue-400/30");
        btn.classList.add("bg-slate-800/80", "text-slate-300", "border-slate-700");
      });

      const activeBtn = document.getElementById(`filter-${category}`);
      if (activeBtn) {
        activeBtn.classList.remove("bg-slate-800/80", "text-slate-300", "border-slate-700");
        activeBtn.classList.add("bg-blue-600", "text-white", "border-blue-400/30");
      }

      showToast(`필터: ${category === 'all' ? '전체' : category === 'country' ? '국가/수도' : category === 'landmark' ? '명산/강/호수' : '대양/바다'}`);
    }

    function resetCameraView() {
      const kr = getCountryInfo("KOR");
      if (kr) onSelectLocation(kr);
      showToast("대한민국 위치로 이동했습니다.");
    }

    function toggleAutoRotate() {
      isAutoRotate = !isAutoRotate;
      const btn = document.getElementById("btn-autorotate");
      if (isAutoRotate) {
        btn.classList.add("bg-blue-600", "text-white");
        showToast("지구본 자동 회전 ON");
      } else {
        btn.classList.remove("bg-blue-600", "text-white");
        showToast("지구본 자동 회전 OFF");
      }
    }

    function toggleDayNight() {
      isDayMode = !isDayMode;
      const btn = document.getElementById("btn-daynight");
      if (isDayMode) {
        dirLight.intensity = 1.2;
        ambientLight.intensity = 0.75;
        btn.innerHTML = `<i class="fa-solid fa-sun text-sm sm:text-base text-amber-400"></i>`;
        showToast("낮 조명 모드");
      } else {
        dirLight.intensity = 0.4;
        ambientLight.intensity = 0.2;
        btn.innerHTML = `<i class="fa-solid fa-moon text-sm sm:text-base text-indigo-300"></i>`;
        showToast("야간 조명 모드");
      }
    }

    function zoomGlobe(delta) {
      camera.position.z = THREE.MathUtils.clamp(camera.position.z - delta * 2, 6.2, 25);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");

      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2000);
    }

    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        searchResults.classList.add("hidden");
        return;
      }

      const allSearchable = [];
      LOCATIONS.forEach(loc => allSearchable.push(getCountryInfo(loc.isoCode)));

      Object.keys(GLOBAL_COUNTRY_MAP).forEach(iso => {
        if (!allSearchable.some(x => x.isoCode === iso)) {
          allSearchable.push(getCountryInfo(iso));
        }
      });

      const matches = allSearchable.filter(loc => 
        (loc.countryName && loc.countryName.toLowerCase().includes(query)) ||
        (loc.capital && loc.capital.toLowerCase().includes(query)) ||
        (loc.isoCode && loc.isoCode.toLowerCase().includes(query)) ||
        (loc.landmarks && loc.landmarks.some(lm => lm.name.toLowerCase().includes(query)))
      ).slice(0, 15);

      if (matches.length === 0) {
        searchResults.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">검색 결과가 없습니다.</div>`;
      } else {
        searchResults.innerHTML = matches.map(loc => `
          <div onclick="selectSearchResult('${loc.isoCode || loc.id}')" class="p-2.5 px-3 hover:bg-slate-800 cursor-pointer flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <span>${loc.flag || '🏳️'}</span>
              <span class="font-bold text-slate-200">${loc.countryName}</span>
            </div>
            <span class="text-[10px] text-amber-300">${loc.capital.split(' ')[0]}</span>
          </div>
        `).join('');
      }

      searchResults.classList.remove("hidden");
    });

    function selectSearchResult(key) {
      const item = getCountryInfo(key);
      if (item) {
        onSelectLocation(item);
        searchInput.value = "";
        searchResults.classList.add("hidden");
      }
    }

    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add("hidden");
      }
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isFocusingAnimation) {
        if (!isPointerDown) {
          if (isAutoRotate) currentRotationVelocity.x = 0.0015;

          if (Math.abs(currentRotationVelocity.x) > 0.00005 || Math.abs(currentRotationVelocity.y) > 0.00005) {
            applyGlobeRotation(currentRotationVelocity.x, currentRotationVelocity.y);
            currentRotationVelocity.x *= 0.92;
            currentRotationVelocity.y *= 0.92;
          }
        }
      }

      if (atmosphereMesh) atmosphereMesh.rotation.y += 0.0005;

      updateMarkersPosition();
      renderer.render(scene, camera);
    }

    window.focusLocation = focusLocation;
    window.closeInfoPanel = closeInfoPanel;
    window.setFilter = setFilter;
    window.resetCameraView = resetCameraView;
    window.toggleAutoRotate = toggleAutoRotate;
    window.toggleBorders = toggleBorders;
    window.toggleDayNight = toggleDayNight;
    window.zoomGlobe = zoomGlobe;
    window.selectSearchResult = selectSearchResult;
    window.openMemoModal = openMemoModal;
    window.closeMemoModal = closeMemoModal;
    window.saveMemo = saveMemo;
    window.deleteMemo = deleteMemo;
    window.openDbModal = openDbModal;
    window.closeDbModal = closeDbModal;
    window.downloadMemoDB = downloadMemoDB;
    window.uploadMemoDB = uploadMemoDB;

    window.onload = function() {
      init3D();
    };
  </script>
</body>
</html>
