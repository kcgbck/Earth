<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Globe Sphere Ocean Gradient -->
    <radialGradient id="oceanGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </radialGradient>

    <!-- Outer Atmospheric Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Canvas Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Atmosphere Outer Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="14" opacity="0.4" filter="url(#glow)"/>

  <!-- Earth Globe Main Ocean Sphere -->
  <circle cx="256" cy="256" r="175" fill="url(#oceanGrad)"/>

  <!-- Stylized Landmass Polygons (Green Continents) -->
  <g fill="#22c55e" opacity="0.95">
    <!-- Eurasia / Korea Peninsula area -->
    <path d="M 210,130 C 260,120 320,135 340,170 C 360,200 320,230 290,210 C 270,195 240,220 220,200 C 190,180 180,140 210,130 Z"/>
    <path d="M 330,190 Q 345,195 340,210 T 325,200 Z" fill="#4ade80"/> <!-- Korea Point -->
    <!-- Africa area -->
    <path d="M 180,240 C 230,230 270,260 260,310 C 250,350 210,360 190,320 C 170,290 160,250 180,240 Z"/>
    <!-- Americas (Left edge preview) -->
    <path d="M 100,160 Q 140,170 130,230 Q 100,280 90,200 Z"/>
    <!-- Australia area -->
    <path d="M 320,310 C 360,300 380,340 350,360 C 320,370 300,330 320,310 Z"/>
  </g>

  <!-- Latitude and Longitude Grid Ring Lines -->
  <ellipse cx="256" cy="256" rx="175" ry="60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="175" ry="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="256" y1="81" x2="256" y2="431" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="80" ry="175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Neon Glowing Orbit Ring -->
  <ellipse cx="256" cy="256" rx="215" ry="75" fill="none" stroke="#facc15" stroke-width="8" transform="rotate(-25 256 256)" filter="url(#glow)"/>
  <circle cx="105" cy="205" r="10" fill="#facc15" filter="url(#glow)"/>
</svg>